[package]
name = "bobine"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
getrandom = "0.3"
secret-service = { version = "5", default-features = false, features = ["rt-async-io-crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
